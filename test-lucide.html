<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <span data-lucide="menu"></span>
  <script>
    setTimeout(() => {
      try {
        console.log("Lucide: ", typeof window.lucide.createIcons);
        window.lucide.createIcons();
        console.log("SVG generated: ", document.body.innerHTML.includes('<svg'));
      } catch (e) { console.error(e); }
    }, 500);
  </script>
</body>
</html>
